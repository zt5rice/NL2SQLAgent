[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sqlagent"
version = "0.1.0"
description = "A natural-language-to-SQL agent that grounds questions in a database schema and validates results."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zt5rice" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
